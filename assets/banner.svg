<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .title-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: url(#title-grad); }
    .subtitle-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 18px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #e2e8f0; }
    
    /* Dynamic Animated Elements */
    .pulse-node {
      animation: pulse 3s infinite ease-in-out;
    }
    .pulse-node-delayed {
      animation: pulse 3s infinite ease-in-out 1.5s;
    }
    .scan-line {
      animation: scan 4s linear infinite;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dash 20s linear infinite;
    }
    .float-card {
      animation: float 6s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      100% { r: 4px; opacity: 0.4; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -200; }
    }
    @keyframes scan {
      0% { transform: translateY(-20px); opacity: 0; }
      50% { opacity: 0.3; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" class="bg" rx="16"/>

  <!-- Tech Grid Background Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" />
  </g>

  <!-- Animated Graph Connections & Network Mesh (Background Dynamic Layer) -->
  <g opacity="0.35">
    <path d="M 800,80 L 950,140 L 1100,90 L 1020,240 L 880,280 L 800,180 Z" fill="none" stroke="#6366f1" stroke-width="1.5" class="flow-line"/>
    <path d="M 850,110 L 1020,240 M 950,140 L 880,280" fill="none" stroke="#06b6d4" stroke-width="1" class="flow-line"/>
  </g>

  <!-- Network Graph Nodes -->
  <g class="float-card">
    <circle cx="800" cy="80" r="6" fill="#38bdf8" class="pulse-node"/>
    <circle cx="950" cy="140" r="6" fill="#818cf8" class="pulse-node-delayed"/>
    <circle cx="1100" cy="90" r="6" fill="#c084fc" class="pulse-node"/>
    <circle cx="1020" cy="240" r="6" fill="#34d399" class="pulse-node-delayed"/>
    <circle cx="880" cy="280" r="6" fill="#f43f5e" class="pulse-node"/>
    <circle cx="800" cy="180" r="6" fill="#fbbf24" class="pulse-node-delayed"/>
  </g>

  <!-- Radar Scan Visual -->
  <g transform="translate(1000, 180)" opacity="0.25">
    <circle r="90" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <circle r="60" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4"/>
    <circle r="30" fill="none" stroke="#c084fc" stroke-width="1"/>
  </g>

  <!-- Animated Badges & Chips -->
  <g transform="translate(60, 245)" class="float-card" filter="url(#shadow)">
    <!-- Pill 1: AML / KYC -->
    <g transform="translate(0, 0)">
      <rect width="110" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="55" y="20" text-anchor="middle" class="badge-text" fill="#38bdf8">🛡️ AML / KYC</text>
    </g>
    <!-- Pill 2: Transaction Monitoring -->
    <g transform="translate(122, 0)">
      <rect width="185" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="92" y="20" text-anchor="middle" class="badge-text" fill="#818cf8">⚡ Transaction Monitoring</text>
    </g>
    <!-- Pill 3: Entity Resolution -->
    <g transform="translate(319, 0)">
      <rect width="155" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="77" y="20" text-anchor="middle" class="badge-text" fill="#c084fc">🔍 Entity Resolution</text>
    </g>
    <!-- Pill 4: Fraud Detection -->
    <g transform="translate(486, 0)">
      <rect width="145" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="72" y="20" text-anchor="middle" class="badge-text" fill="#34d399">🚨 Fraud Analytics</text>
    </g>
  </g>

  <!-- Foreground Title and Main Content (Guaranteed Unobscured) -->
  <g transform="translate(60, 95)" filter="url(#shadow)">
    <!-- Decorative Shield Icon -->
    <g transform="translate(0, 5)">
      <path d="M 22 0 L 44 10 L 44 26 C 44 42 22 54 22 54 C 22 54 0 42 0 26 L 0 10 Z" fill="url(#title-grad)" opacity="0.9"/>
      <path d="M 22 8 L 36 15 L 36 26 C 36 37 22 45 22 45 C 22 45 8 37 8 26 L 8 15 Z" fill="#0f172a"/>
      <path d="M 18 24 L 21 28 L 28 18" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Main Title Header -->
    <text x="60" y="38" class="title-text" filter="url(#glow)">Awesome Financial Crime Intelligence</text>

    <!-- Subtitle Header -->
    <text x="60" y="78" class="subtitle-text">Curated Ecosystem of Enterprise SaaS Platforms &amp; Open-Source AML/Fraud Intelligence Tools</text>

    <!-- Secondary Line -->
    <text x="60" y="106" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">
      Tracking Transaction Monitoring • Sanctions Screening • Graph Analytics • Entity Resolution
    </text>
  </g>
</svg>
